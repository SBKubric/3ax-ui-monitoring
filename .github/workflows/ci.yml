name: CI

on:
    push:
        branches:
            - main
        tags-ignore:
            - "v*"
    pull_request:

permissions:
    contents: read

env:
    # mattn/go-sqlite3 (gorm.io/driver/sqlite) is cgo, same as the panel.
    CGO_ENABLED: 1

jobs:
    check:
        name: Build, vet, lint and test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build
              run: go build ./...

            - name: Vet
              run: go vet ./...

            - name: Check formatting
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      echo "These files are not gofmt'ed:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Staticcheck
              run: |
                  go install honnef.co/go/tools/cmd/staticcheck@latest
                  staticcheck ./...

            - name: Test with the race detector
              run: go test -race -count=1 ./...
