name: CI

on:
    push:
        branches:
            - main
        tags-ignore:
            - "v*"
    pull_request:

permissions:
    contents: read

env:
    # mattn/go-sqlite3 (gorm.io/driver/sqlite) is cgo, same as the panel.
    CGO_ENABLED: 1

jobs:
    check:
        name: Build, vet, lint and test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build
              run: go build ./...

            - name: Vet
              run: go vet ./...

            - name: Check formatting
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      echo "These files are not gofmt'ed:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Staticcheck
              run: |
                  go install honnef.co/go/tools/cmd/staticcheck@latest
                  staticcheck ./...

            # internal/client/xray checks the child-process contract against
            # the real binary (exit 23 + an error line on a bad config); the
            # test skips when docker is unavailable, so pull the image here to
            # make sure CI actually runs it.
            - name: Pull the xray image used by the mon-client tests
              run: docker pull ghcr.io/xtls/xray-core:latest

            # internal/client/awg holds a real AmneziaWG handshake against
            # this image (spec §9's open question). The test skips without
            # docker, so pull the image to make sure CI runs it.
            - name: Pull the AmneziaWG image used by the mon-client tests
              run: docker pull amneziavpn/amneziawg-go:latest

            - name: Test with the race detector
              run: go test -race -count=1 ./...

            # mon-client generates xray.json itself (spec §4 step 2), so the
            # generated config is checked by the real core (image pulled
            # above), the same `xray -test` mon-client runs before every restart.
            - name: Integration tests against xray-core
              run: go test -count=1 ./internal/client/config/... -run Integration
