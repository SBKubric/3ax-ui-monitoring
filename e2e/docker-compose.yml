# The app under test for the Playwright suite (docs/agents/testing.md): this
# repository's own image, a fresh database every run, credentials from the
# environment. Never point this at a developer or production instance.
services:
  mon-server:
    image: ${MON_IMAGE:-3ax-mon-server:dev}
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      MON_LISTEN: ":443"
      MON_DATA_DIR: "/var/lib/mon-server"
      # Every mon-client configuration carries probeUrl built from this
      # address, so the service needs one even where ACME does not run.
      MON_PUBLIC_IP: "${MON_PUBLIC_IP:-127.0.0.1}"
      # A self-signed certificate generated by `make -C e2e certs`. ACME cannot
      # run in a test container, so the suite always uses tls.mode = files.
      MON_TLS_MODE: "files"
      MON_TLS_CERT: "/certs/server.crt"
      MON_TLS_KEY: "/certs/server.key"
      MON_ADMIN_USER: "${MON_ADMIN_USER:-admin}"
      MON_ADMIN_PASSWORD: "${MON_ADMIN_PASSWORD:-e2e-password}"
    # Seed the administrator non-interactively, then serve. `admin set` reads
    # MON_ADMIN_PASSWORD when it is set, so no TTY is needed.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mon-server admin set "$${MON_ADMIN_USER}"
        exec mon-server run
    ports:
      - "${MON_PORT:-8443}:443"
    volumes:
      - ./certs:/certs:ro
    # A fresh database per run, with nothing to clean up afterwards.
    tmpfs:
      - /var/lib/mon-server
